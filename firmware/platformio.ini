; FaultBed node firmware
;   pio run -e esp32dev -t upload        (flash one board; repeat per board)
;   pio device monitor -b 921600         (optional: watch the JSON event stream)
; Every board gets the same image; the controller assigns ids and roles at run time.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DFB_BAUD=921600
    -Wall

[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DFB_LED_PIN=2

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DFB_LED_PIN=8 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
