[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultbed"
version = "0.1.0"
description = "Controller for FaultBed, a low-cost reproducible fault-injection testbed for IoT protocols"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
faultbed = "faultbed.cli:main"

[tool.setuptools.packages.find]
include = ["faultbed*"]

[tool.setuptools.package-data]
"faultbed.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
